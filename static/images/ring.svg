<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="300">
  <defs>
    <radialGradient id="goldShine" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6d1c" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="#131924" />
  <circle cx="200" cy="200" r="120" stroke="url(#goldShine)" stroke-width="28" fill="none" filter="url(#glow)" />
  <circle cx="200" cy="200" r="106" stroke="#f3e5ab" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="200" cy="200" r="134" stroke="#8a6d1c" stroke-width="2" fill="none" opacity="0.8" />
  <!-- Tengwar inscription simulation -->
  <text x="200" y="195" fill="#f3e5ab" font-family="Cinzel, serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="4">ONE RING TO RULE THEM ALL</text>
  <text x="200" y="215" fill="#d4af37" font-family="Cinzel, serif" font-size="11" text-anchor="middle" letter-spacing="3">ONE RING TO FIND THEM</text>
</svg>
